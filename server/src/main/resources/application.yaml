spring:
  application:
    name: server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/httt_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      data-locations: classpath:db/schema-optimization.sql,classpath:db/seed.sql
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:redis123}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      repositories:
        enabled: false
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:demo-openai-key}
  security:
    user:
      name: ${SPRING_SECURITY_USER_NAME:dev-admin}
      password: ${SPRING_SECURITY_USER_PASSWORD:dev-password-change-me}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

app:
  security:
    jwt-secret: ${JWT_SECRET:}
    access-token-duration: ${APP_SECURITY_ACCESS_TOKEN_DURATION:PT30M}
    refresh-token-duration: ${APP_SECURITY_REFRESH_TOKEN_DURATION:P7D}
